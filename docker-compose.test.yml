services:
  postgres-test:
    image: postgres:15-alpine
    container_name: bbokbbok-postgres-test
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: bbokbbok_test
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testuser -d bbokbbok_test']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: bbokbbok-redis-test
    command: ['redis-server', '--requirepass', 'testredis']
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'testredis', 'PING']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-test-data:
